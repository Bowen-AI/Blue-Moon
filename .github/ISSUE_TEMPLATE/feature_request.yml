name: Feature Request
description: Suggest a small product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Blue Moon is trying to prove the core loop first: post, join, complete, share proof.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user problem, not just the feature.
      placeholder: Organizers need an easier way to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Keep the first version lightweight.
      placeholder: Add a simple...
    validations:
      required: true
  - type: dropdown
    id: user
    attributes:
      label: Who is this for?
      options:
        - Organizer
        - Participant
        - Member profile
        - Maintainer/admin
        - Local community partner
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: We could also...
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This supports posting, joining, completing, or sharing proof.
        - label: This can be tested without building a full marketplace.
